      { q: "Resesi : Output : Penurunan = ... : ... : ...", options: ["Deflasi : Harga : Penurunan", "Stagflasi : Pertumbuhan : Stagnan", "Inflasi : Uang : Depresiasi", "Ekspansi : Ekonomi : Peningkatan", "Pengangguran : Tenaga Kerja : Surplus"], answer: 0, explanation: "Resesi ditandai dengan Penurunan nilai Output perekonomian. Sebanding dengan Deflasi yang ditandai dengan Penurunan tingkat Harga." },
      { q: "Prisma : Cahaya : Pembiasan = ... : ... : ...", options: ["Lensa : Bayangan : Pemfokusan", "Gema : Suara : Pemantulan", "Layar : Gambar : Proyeksi", "Filter : Warna : Penyaringan", "Magnet : Medan : Penarikan"], answer: 0, explanation: "Prisma memproses Cahaya melalui peristiwa Pembiasan. Sebanding dengan Lensa memproses cahaya untuk pembentukan Bayangan melalui Pemfokusan." },

      { q: "Vektor : Besaran : Arah = ... : ... : ...", options: ["Matriks : Baris : Kolom", "Skalar : Nilai : Tanpa Arah", "Koordinat : Titik : Posisi", "Fungsi : Domain : Kodomain", "Garis : Panjang : Dimensi"], answer: 1, explanation: "Vektor adalah Besaran yang memiliki nilai dan Arah. Sebanding dengan Skalar yang merupakan besaran yang hanya memiliki Nilai Tanpa Arah." },
      { q: "Kriptografi : Enkripsi : Keamanan = ... : ... : ...", options: ["Antivirus : Scanning : Proteksi", "Firewall : Filtering : Blokir", "Autentikasi : Verifikasi : Akses", "Steganografi : Penyembunyian : Kerahasiaan", "Backup : Duplikasi : Pemulihan"], answer: 3, explanation: "Kriptografi menggunakan Enkripsi untuk menjaga Keamanan data. Sebanding dengan Steganografi menggunakan Penyembunyian pesan untuk menjaga Kerahasiaan." },
      { q: "Kromatografi : Pemisahan : Pigmen = ... : ... : ...", options: ["Distilasi : Pemurnian : Cairan", "Centrifugasi : Pemisahan : Endapan", "Electrophoresis : Pemisahan : DNA", "Kristalisasi : Pembentukan : Padatan", "Titrasi : Penentuan : Kadar"], answer: 2, explanation: "Kromatografi teknik Pemisahan sampel berdasarkan komponen seperti Pigmen. Sebanding dengan Electrophoresis teknik Pemisahan molekul seperti DNA." },
      { q: "Yurisdiksi : Wilayah : Kewenangan = ... : ... : ...", options: ["Otonomi : Daerah : Hak", "Kedaulatan : Negara : Kekuasaan", "Domisili : Tempat : Tinggal", "Kompetensi : Bidang : Keahlian", "Otoritas : Jabatan : Hak"], answer: 3, explanation: "Yurisdiksi menentukan cakupan Wilayah hukum atas Kewenangan. Sebanding dengan Kompetensi menentukan cakupan Bidang tugas atas Keahlian." },
      { q: "Fotosintesis : Anabolisme : Energi = ... : ... : ...", options: ["Glikolisis : Katabolisme : ATP", "Fermentasi : Anaerob : Asam", "Krenasi : Osmosis : Air", "Transkripsi : Sintesis : RNA", "Digesti : Hidrolisis : Makanan"], answer: 0, explanation: "Fotosintesis adalah reaksi Anabolisme yang menyimpan/membutuhkan Energi. Sebanding dengan Glikolisis yang merupakan reaksi Katabolisme yang menghasilkan ATP." },
      { q: "Restrukturisasi : Organisasi : Efisiensi = ... : ... : ...", options: ["Renovasi : Bangunan : Estetika", "Rehabilitasi : Fisik : Pemulihan", "Reformasi : Tatanan : Kemajuan", "Revisi : Dokumen : Akurasi", "Rekayasa : Sistem : Optimaasi"], answer: 2, explanation: "Restrukturisasi dilakukan pada Organisasi untuk mencapai Efisiensi. Sebanding dengan Reformasi dilakukan pada Tatanan sistem untuk mencapai Kemajuan." },
      { q: "Inersia : Massa : Kecondongan = ... : ... : ...", options: ["Elastisitas : Bahan : Kelenturan", "Momentum : Kecepatan : Gerak", "Entropi : Sistem : Keacakan", "Gravitasi : Jarak : Tarikan", "Friksi : Permukaan : Hambatan"], answer: 2, explanation: "Inersia bergantung pada Massa yang menyatakan Kecondongan mempertahankan keadaan. Sebanding dengan Entropi pada Sistem yang menyatakan tingkat Keacakan." },
      { q: "Aksioma : Teorema : Pembuktian = ... : ... : ...", options: ["Dogma : Doktrin : Keyakinan", "Hipotesis : Hukum : Eksperimen", "Postulat : Proposisi : Deduksi", "Premis : Kesimpulan : Logika", "Teori : Model : Simulasi"], answer: 2, explanation: "Aksioma menjadi dasar bagi Teorema yang membutuhkan Pembuktian. Sebanding dengan Postulat yang menjadi dasar bagi Proposisi melalui proses Deduksi." },
      { q: "Kuantisasi : Foton : Energi = ... : ... : ...", options: ["Ionisasi : Elektron : Muatan", "Disintegrasi : Radiasi : Inti", "Kristalisasi : Molekul : Kisi", "Kondensasi : Uap : Titik Air", "Kromatin : Gen : DNA"], answer: 0, explanation: "Kuantisasi menjelaskan Foton sebagai paket Energi. Sebanding dengan Ionisasi yang menjelaskan pelepasan Elektron untuk menghasilkan Muatan." },
      { q: "Etimologi : Kata : Sejarah = ... : ... : ...", options: ["Genealogi : Keluarga : Silsilah", "Arkeologi : Artefak : Peradaban", "Paleontologi : Fosil : Kehidupan", "Kronologi : Peristiwa : Waktu", "Geologi : Batuan : Bumi"], answer: 2, explanation: "Etimologi mempelajari Kata berdasarkan Sejarah perkembangannya. Sebanding dengan Paleontologi yang mempelajari Fosil berdasarkan Sejarah Kehidupan purba." }
    ];

    // Render Quiz Questions
    const form = document.getElementById("quizForm");
    const chunkSize = 10;

    hotsQuestions.forEach((q, i) => {
      if (i % chunkSize === 0) {
        const sectionHeader = document.createElement("div");
        sectionHeader.className = "section-title";
        sectionHeader.innerText = `BAGIAN ${Math.floor(i / chunkSize) + 1} (SOAL ${i + 1} - ${Math.min(i + chunkSize, hotsQuestions.length)})`;
        form.appendChild(sectionHeader);
      }

      const block = document.createElement("div");
      block.className = "question-block";

      let optionsHTML = '';
      q.options.forEach((opt, j) => {
        optionsHTML += `
          <div class="options">
            <label>
              <input type="radio" name="q${i}" value="${j}">
              ${String.fromCharCode(65 + j)}. ${opt}
            </label>
          </div>`;
      });

      block.innerHTML = `
        <div class="question">${i + 1}. ${q.q}</div>
        ${optionsHTML}
      `;
      form.appendChild(block);
    });

    // Timer Countdown Script (40 Minutes = 2400 seconds)
    let totalTime = 40 * 60;
    let timerInterval = null;

    function startTimer() {
      const display = document.getElementById("countdown");
      timerInterval = setInterval(() => {
        let minutes = Math.floor(totalTime / 60);
        let seconds = totalTime % 60;

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.textContent = `${minutes}:${seconds}`;

        if (totalTime <= 300) { // 5 minutes remaining
          display.classList.add("warning");
        }

        if (totalTime <= 0) {
          clearInterval(timerInterval);
          alert("Waktu 40 menit telah habis! Jawaban Anda akan otomatis dikumpulkan.");
          submitQuiz(true);
        } else {
          totalTime--;
        }
      }, 1000);
    }

    // Auto-start timer on page load
    window.onload = function() {
      startTimer();
    };

    function submitQuiz(isTimeUp = false) {
      if (timerInterval) {
        clearInterval(timerInterval);
      }

      // Disable inputs
      const inputs = document.querySelectorAll("input[type='radio']");
      inputs.forEach(input => input.disabled = true);
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").style.backgroundColor = "#94a3b8";

      let score = 0;
      let explanationsHTML = '<h2>Pembahasan Detail Soal HOTS:</h2>';

      hotsQuestions.forEach((q, i) => {
        const selected = document.querySelector(`input[name='q${i}']:checked`);
        const ansIndex = q.answer;
        const correctText = q.options[ansIndex];
        let userSelectedText = "Tidak dijawab";
        let isCorrect = false;

        if (selected) {
          const userVal = parseInt(selected.value);
          if (userVal === ansIndex) {
            score++;
            isCorrect = true;
          }
          userSelectedText = `${String.fromCharCode(65 + userVal)}. ${q.options[userVal]}`;
        }

        explanationsHTML += `
          <div class="explanation-item">
            <p><strong>Soal ${i + 1}:</strong> ${q.q}</p>
            <p>Jawaban Anda: <span style="color: ${isCorrect ? '#059669' : '#dc2626'}; font-weight: bold;">${userSelectedText}</span></p>
            <p>Jawaban Benar: <span class="correct-ans">${String.fromCharCode(65 + ansIndex)}. ${correctText}</span></p>
            <p><em>Analogi & Pembahasan:</em> ${q.explanation}</p>
          </div>
        `;
      });

      const finalScore = (score / hotsQuestions.length) * 100;

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `
        <h2>${isTimeUp ? 'Waktu Habis! Hasil Ujian Anda' : 'Hasil Tes Analogi HOTS Anda'}</h2>
        <p style="font-size: 26px; font-weight: bold; margin: 10px 0;">Skor: ${score} / ${hotsQuestions.length} (Nilai: ${finalScore.toFixed(1)})</p>
        <p>${finalScore >= 75 ? 'Sangat Luar Biasa! Penalaran logis dan pemahaman konsep HOTS Anda sangat kuat.' : 'Tetap Semangat! Soal tingkat HOTS memerlukan pemahaman pola konseptual. Pelajari pembahasan di bawah ini.'}</p>
      `;
      resultDiv.classList.remove("hidden");

      const expDiv = document.getElementById("explanation");
      expDiv.innerHTML = explanationsHTML;
      expDiv.classList.remove("hidden");

      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
