      { q: "Buku : Membaca : Ilmu = ... : ... : ...", options: ["Olahraga : Berlatih : Sehat", "Makanan : Makan : Kenyang", "Musik : Mendengar : Hiburan", "Sekolah : Belajar : Pintar", "Bekerja : Usaha : Uang"], answer: 1, explanation: "Dengan Buku melalui Membaca akan mendapatkan Ilmu. Sebanding dengan Makanan melalui Makan akan mendapatkan Kenyang." },
      { q: "Kompor : Dapur : Memasak = ... : ... : ...", options: ["Kasur : Kamar : Tidur", "Sofa : Ruang Tamu : Duduk", "Mobil : Garasi : Parkir", "Televisi : Ruang Keluarga : Nonton", "Mandi : Kamar Mandi : Bersih"], answer: 0, explanation: "Kompor diletakkan di Dapur berfungsi untuk Memasak. Sebanding dengan Kasur diletakkan di Kamar berfungsi untuk Tidur." },
      { q: "Gitar : Senar : Dipetik = ... : ... : ...", options: ["Drum : Kulit : Dipukul", "Seruling : Lubang : Ditiup", "Biola : Senar : Digesek", "Piano : Tuts : Ditekan", "Gong : Logam : Dipukul"], answer: 2, explanation: "Gitar memiliki bagian Senar yang dimainkan dengan cara Dipetik. Sebanding dengan Biola memiliki bagian Senar yang dimainkan dengan cara Digesek." },
      { q: "Guru : Mengajar : Kelas = ... : ... : ...", options: ["Dokter : Mengobati : Ruang Perawat", "Koki : Memasak : Dapur", "Penyanyi : Bernyanyi : Panggung", "Petani : Menanam : Sawah", "Sopir : Mengemudi : Jalan"], answer: 1, explanation: "Guru bertugas Mengajar di lokasi Kelas. Sebanding dengan Koki bertugas Memasak di lokasi Dapur." },
      { q: "Ayam : Daging : Bertelur = ... : ... : ...", options: ["Sapi : Susu : Melahirkan", "Kambing : Daging : Menyusui", "Ikan : Daging : Bertelur", "Bebek : Telur : Berenang", "Burung : Bulu : Terbang"], answer: 0, explanation: "Ayam menghasilkan Daging dan berkembang biak dengan Bertelur. Sebanding dengan Sapi menghasilkan Susu dan berkembang biak dengan Melahirkan." },
      { q: "Kertas : Tipis : Sobek = ... : ... : ...", options: ["Kaca : Keras : Pecah", "Kain : Lembut : Jahit", "Batu : Berat : Lempar", "Kayu : Keras : Patah", "Plastik : Lentur : Tekuk"], answer: 0, explanation: "Kertas memiliki sifat Tipis dan bisa Sobek. Sebanding dengan Kaca memiliki sifat Keras dan bisa Pecah." },
      { q: "Jam : Waktu : Pengukur = ... : ... : ...", options: ["Timbangan : Berat : Pengukur", "Termometer : Suhu : Pengukur", "Mistar : Panjang : Pengukur", "Spedometer : Kecepatan : Pengukur", "Penggaris : Garis : Alat"], answer: 2, explanation: "Jam menunjukkan Waktu sebagai alat Pengukur. Sebanding dengan Mistar menunjukkan Panjang sebagai alat Pengukur." },
      { q: "Cangkul : Petani : Tanah = ... : ... : ...", options: ["Jaring : Nelayan : Ikan", "Kuas : Pelukis : Kanvas", "Gunting : Penjahit : Kain", "Sapu : Pasukan Kuning : Jalan", "Palu : Tukang : Paku"], answer: 2, explanation: "Cangkul digunakan Petani untuk mengolah Tanah. Sebanding dengan Gunting digunakan Penjahit untuk memotong Kain." },
      { q: "Singa : Hutan : Karnivora = ... : ... : ...", options: ["Sapi : Padang Rumput : Herbivora", "Kambing : Kandang : Herbivora", "Hiu : Laut : Karnivora", "Ayam : Halaman : Omnivora", "Monyet : Pohon : Omnivora"], answer: 2, explanation: "Singa tinggal di Hutan dan tergolong Karnivora. Sebanding dengan Hiu tinggal di Laut dan tergolong Karnivora." },
      { q: "Siang : Panas : Terang = ... : ... : ...", options: ["Malam : Dingin : Gelap", "Pagi : Sejuk : Cerah", "Hujan : Dingin : Basah", "Sore : Hangat : Redup", "Salju : Dingin : Putih"], answer: 0, explanation: "Siang hari identik dengan suhu Panas dan suasana Terang. Sebanding dengan Malam hari identik dengan suhu Dingin dan suasana Gelap." }
    ];

    // Encryption & Auto-Shuffle Key Function
    function shuffleArray(array) {
      let currentIndex = array.length, randomIndex;
      let seed = 20260805; // Auto key base
      while (currentIndex != 0) {
        randomIndex = Math.floor(Math.abs(Math.sin(seed++)) * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    // Processed Question List
    const quizQuestions = shuffleArray([...baseEasyQuestions]);

    let currentQuestionIndex = 0;
    const userAnswers = new Array(quizQuestions.length).fill(null);

    // Render Single Question Function
    function renderQuestion(index) {
      const container = document.getElementById("questionContainer");
      const q = quizQuestions[index];

      let optionsHTML = '';
      q.options.forEach((opt, j) => {
        const isChecked = userAnswers[index] === j ? 'checked' : '';
        optionsHTML += `
          <div class="options">
            <label>
              <input type="radio" name="q${index}" value="${j}" ${isChecked} onchange="selectAnswer(${index}, ${j})">
              ${String.fromCharCode(65 + j)}. ${opt}
            </label>
          </div>`;
      });

      container.innerHTML = `
        <div class="question-block">
          <div class="question">${index + 1}. ${q.q}</div>
          ${optionsHTML}
        </div>
      `;

      // Update Progress Tracker UI
      const currentNo = index + 1;
      const totalNo = quizQuestions.length;
      const percent = Math.round((currentNo / totalNo) * 100);

      document.getElementById("questionProgressText").innerText = `Soal ${currentNo} dari ${totalNo}`;
      document.getElementById("percentText").innerText = `${percent}%`;
      document.getElementById("progressBarFill").style.width = `${percent}%`;

      // Update Navigation Buttons Status
      document.getElementById("btnPrev").disabled = index === 0;
      document.getElementById("btnNext").disabled = index === quizQuestions.length - 1;
    }

    // Handle Option Selection with Auto-Next
    function selectAnswer(qIndex, valIndex) {
      userAnswers[qIndex] = valIndex;
      
      if (qIndex < quizQuestions.length - 1) {
        setTimeout(() => {
          nextQuestion();
        }, 300);
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < quizQuestions.length - 1) {
        currentQuestionIndex++;
        renderQuestion(currentQuestionIndex);
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion(currentQuestionIndex);
      }
    }

    // Timer Countdown Script (40 Minutes = 2400 seconds)
    let totalTime = 40 * 60;
    let timerInterval = null;

    function startTimer() {
      const display = document.getElementById("countdown");
      timerInterval = setInterval(() => {
        let minutes = Math.floor(totalTime / 60);
        let seconds = totalTime % 60;

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.textContent = `${minutes}:${seconds}`;

        if (totalTime <= 300) { // 5 minutes warning
          display.classList.add("warning");
        }

        if (totalTime <= 0) {
          clearInterval(timerInterval);
          alert("Waktu 40 menit telah habis! Jawaban Anda otomatis dikumpulkan.");
          submitQuiz(true);
        } else {
          totalTime--;
        }
      }, 1000);
    }

    window.onload = function() {
      renderQuestion(0);
      startTimer();
    };

    function submitQuiz(isTimeUp = false) {
      if (timerInterval) {
        clearInterval(timerInterval);
      }

      // Hide question interface & navs
      document.getElementById("questionContainer").style.display = "none";
      document.getElementById("navButtons").style.display = "none";
      document.getElementById("progressContainer").style.display = "none";

      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").style.backgroundColor = "#94a3b8";

      let score = 0;
      let explanationsHTML = '<h2>Pembahasan Detail Soal Level Mudah:</h2>';

      quizQuestions.forEach((q, i) => {
        const userVal = userAnswers[i];
        const ansIndex = q.answer;
        const correctText = q.options[ansIndex];
        let userSelectedText = "Tidak dijawab";
        let isCorrect = false;

        if (userVal !== null) {
          if (userVal === ansIndex) {
            score++;
            isCorrect = true;
          }
          userSelectedText = `${String.fromCharCode(65 + userVal)}. ${q.options[userVal]}`;
        }

        explanationsHTML += `
          <div class="explanation-item">
            <p><strong>Soal ${i + 1}:</strong> ${q.q}</p>
            <p>Jawaban Anda: <span style="color: ${isCorrect ? '#16a34a' : '#dc2626'}; font-weight: bold;">${userSelectedText}</span></p>
            <p>Jawaban Benar: <span class="correct-ans">${String.fromCharCode(65 + ansIndex)}. ${correctText}</span></p>
            <p><em>Penjelasan Sederhana:</em> ${q.explanation}</p>
          </div>
        `;
      });

      const finalScore = (score / quizQuestions.length) * 100;

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `
        <h2>${isTimeUp ? 'Waktu Habis! Hasil Ujian Anda' : 'Hasil Tes Analogi Level Mudah'}</h2>
        <p style="font-size: 26px; font-weight: bold; margin: 10px 0;">Skor: ${score} / ${quizQuestions.length} (Nilai: ${finalScore.toFixed(1)})</p>
        <p>${finalScore >= 75 ? 'Luar Biasa! Pemahaman dasar korelasi kata Anda sangat baik.' : 'Tetap Semangat! Pelajari kembali hubungan kata sederhana pada pembahasan di bawah ini.'}</p>
      `;
      resultDiv.classList.remove("hidden");

      const expDiv = document.getElementById("explanation");
      expDiv.innerHTML = explanationsHTML;
      expDiv.classList.remove("hidden");

      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
