      { q: "Monarki : Raja : Mahkota = ... : ... : ...", options: ["Republik : Presiden : Istana", "Keuskupan : Uskup : Tongkat Gembala", "Demokrasi : Rakyat : Hak Pilih", "Militer : Jenderal : Bintang", "Kekaisaran : Kaisar : Singgasana"], answer: 1, explanation: "Sistem Monarki dipimpin Raja yang identik dengan simbol Mahkota. Sebanding dengan Keuskupan dipimpin Uskup yang identik dengan simbol Tongkat Gembala." },

      { q: "Kapital : Investasi : Keuntungan = ... : ... : ...", options: ["Pengetahuan : Belajar : Prestasi", "Tenaga : Kerja : Upah", "Latihan : Taktik : Kemenangan", "Benang : Tenun : Kain", "Bibit : Tanam : Panen"], answer: 4, explanation: "Kapital ditanamkan melalui Investasi untuk menghasilkan Keuntungan. Sebanding dengan Bibit ditanamkan melalui Tanam untuk menghasilkan Panen." },
      { q: "Hukum : Hakim : Keadilan = ... : ... : ...", options: ["Pendidikan : Guru : Kecerdasan", "Agama : Ustadz : Kedamaian", "Kesehatan : Dokter : Kesembuhan", "Lalu Lintas : Polisi : Ketertiban", "Politik : Politisi : Kekuasaan"], answer: 3, explanation: "Hukum ditegakkan oleh Hakim untuk mewujudkan Keadilan. Sebanding dengan Aturan Lalu Lintas ditegakkan oleh Polisi untuk mewujudkan Ketertiban." },
      { q: "Batu : Metamorfosis : Marmer = ... : ... : ...", options: ["Ulat : Metamorfosis : Kupu-kupu", "Pasir : Peleburan : Kaca", "Kayu : Pelapukan : Fosil", "Air : Pembekuan : Es", "Biji : Perkecambahan : Tunas"], answer: 1, explanation: "Batu mengalami proses Metamorfosis (perubahan bentuk/geologi) menjadi Marmer. Sebanding dengan Pasir mengalami proses Peleburan menjadi Kaca." },
      { q: "Bahasa : Tata Bahasa : Komunikasi = ... : ... : ...", options: ["Musik : Harmoni : Ekspresi", "Lalu Lintas : Rambu : Kelancaran", "Tari : Koreografi : Keindahan", "Komputer : Algoritma : Pemrosesan", "Masyarakat : Hukum : Ketertiban"], answer: 3, explanation: "Bahasa diatur oleh Tata Bahasa untuk mencapai Komunikasi yang efektif. Sebanding dengan Komputer diatur oleh Algoritma untuk mencapai Pemrosesan yang efektif." },
      { q: "Suhu : Kalor : Pemuaian = ... : ... : ...", options: ["Gaya : Beban : Pergeseran", "Tegangan : Arus : Hambatan", "Tekanan : Volume : Kompresi", "Kecepatan : Gesekan : Panas", "Konsentrasi : Reaksi : Laju"], answer: 3, explanation: "Peningkatan Suhu akibat Kalor menyebabkan Pemuaian. Sebanding dengan peningkatan Kecepatan akibat Gesekan menyebabkan Panas." },
      { q: "Insulator : Kalor : Penahan = ... : ... : ...", options: ["Konduktor : Listrik : Penyalur", "Kapasitor : Arus : Penyimpan", "Sikring : Beban : Pemutus", "Katalis : Reaksi : Pengcepat", "Filter : Saringan : Pemisah"], answer: 0, explanation: "Insulator berfungsi terhadap Kalor sebagai Penahan. Sebanding dengan Konduktor berfungsi terhadap Listrik sebagai Penyalur." },

      { q: "Drama : Prolog : Epilog = ... : ... : ...", options: ["Buku : Kata Pengantar : Daftar Pustaka", "Lagu : Intro : Outro", "Ujian : Pembukaan : Penutup", "Rapat : Pembuka : Doa Penutup", "Cerita : Konflik : Resolusi"], answer: 1, explanation: "Drama diawali dengan Prolog dan diakhiri dengan Epilog. Sebanding dengan Lagu yang diawali dengan Intro dan diakhiri dengan Outro." }
    ];

    // Encryption & Auto-Shuffle Key Function
    function shuffleArray(array) {
      let currentIndex = array.length, randomIndex;
      let seed = 20260806; // Auto key base
      while (currentIndex != 0) {
        randomIndex = Math.floor(Math.abs(Math.sin(seed++)) * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    // Encrypted / Processed Question List
    const quizQuestions = shuffleArray([...baseMediumQuestions]);

    // Render Quiz Form
    const form = document.getElementById("quizForm");
    const chunkSize = 10;

    quizQuestions.forEach((q, i) => {
      if (i % chunkSize === 0) {
        const sectionHeader = document.createElement("div");
        sectionHeader.className = "section-title";
        sectionHeader.innerText = `BAGIAN ${Math.floor(i / chunkSize) + 1} (SOAL ${i + 1} - ${Math.min(i + chunkSize, quizQuestions.length)})`;
        form.appendChild(sectionHeader);
      }

      const block = document.createElement("div");
      block.className = "question-block";

      let optionsHTML = '';
      q.options.forEach((opt, j) => {
        optionsHTML += `
          <div class="options">
            <label>
              <input type="radio" name="q${i}" value="${j}">
              ${String.fromCharCode(65 + j)}. ${opt}
            </label>
          </div>`;
      });

      block.innerHTML = `
        <div class="question">${i + 1}. ${q.q}</div>
        ${optionsHTML}
      `;
      form.appendChild(block);
    });

    // Timer Countdown Script (40 Minutes = 2400 seconds)
    let totalTime = 40 * 60;
    let timerInterval = null;

    function startTimer() {
      const display = document.getElementById("countdown");
      timerInterval = setInterval(() => {
        let minutes = Math.floor(totalTime / 60);
        let seconds = totalTime % 60;

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.textContent = `${minutes}:${seconds}`;

        if (totalTime <= 300) { // 5 minutes warning
          display.classList.add("warning");
        }

        if (totalTime <= 0) {
          clearInterval(timerInterval);
          alert("Waktu 40 menit telah habis! Jawaban Anda otomatis dikumpulkan.");
          submitQuiz(true);
        } else {
          totalTime--;
        }
      }, 1000);
    }

    window.onload = function() {
      startTimer();
    };

    function submitQuiz(isTimeUp = false) {
      if (timerInterval) {
        clearInterval(timerInterval);
      }

      const inputs = document.querySelectorAll("input[type='radio']");
      inputs.forEach(input => input.disabled = true);
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").style.backgroundColor = "#94a3b8";

      let score = 0;
      let explanationsHTML = '<h2>Pembahasan Detail Soal Level Sedang:</h2>';

      quizQuestions.forEach((q, i) => {
        const selected = document.querySelector(`input[name='q${i}']:checked`);
        const ansIndex = q.answer;
        const correctText = q.options[ansIndex];
        let userSelectedText = "Tidak dijawab";
        let isCorrect = false;

        if (selected) {
          const userVal = parseInt(selected.value);
          if (userVal === ansIndex) {
            score++;
            isCorrect = true;
          }
          userSelectedText = `${String.fromCharCode(65 + userVal)}. ${q.options[userVal]}`;
        }

        explanationsHTML += `
          <div class="explanation-item">
            <p><strong>Soal ${i + 1}:</strong> ${q.q}</p>
            <p>Jawaban Anda: <span style="color: ${isCorrect ? '#16a34a' : '#dc2626'}; font-weight: bold;">${userSelectedText}</span></p>
            <p>Jawaban Benar: <span class="correct-ans">${String.fromCharCode(65 + ansIndex)}. ${correctText}</span></p>
            <p><em>Analisis Korelasi Kata:</em> ${q.explanation}</p>
          </div>
        `;
      });

      const finalScore = (score / quizQuestions.length) * 100;

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `
        <h2>${isTimeUp ? 'Waktu Habis! Hasil Ujian Anda' : 'Hasil Tes Analogi Level Sedang'}</h2>
        <p style="font-size: 26px; font-weight: bold; margin: 10px 0;">Skor: ${score} / ${quizQuestions.length} (Nilai: ${finalScore.toFixed(1)})</p>
        <p>${finalScore >= 75 ? 'Sangat Bagus! Kemampuan analisis korelasi tingkat sedang Anda sangat solid.' : 'Terus Berlatih! Pelajari kerangka logika dan pola korelasi kata pada pembahasan di bawah ini.'}</p>
      `;
      resultDiv.classList.remove("hidden");

      const expDiv = document.getElementById("explanation");
      expDiv.innerHTML = explanationsHTML;
      expDiv.classList.remove("hidden");

      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
