      { q: "Benang : Jarum : Menjahit = ... : ... : ...", options: ["Tinta : Pena : Menulis", "Cat : Kuas : Melukis", "Semen : Sendok Adukan : Membangun", "Batu : Ketapel : Melempar", "Air : Selang : Menyiram"], answer: 0, explanation: "Benang dan Jarum dipadukan untuk aktivitas Menjahit. Sebanding dengan Tinta dan Pena dipadukan untuk aktivitas Menulis." },
      { q: "Teleskop : Bintang : Astronomi = ... : ... : ...", options: ["Mikroskop : Bakteri : Biologi", "Stetoskop : Jantung : Kedokteran", "Termometer : Suhu : Fisika", "Peta : Wilayah : Geografi", "Kamera : Objek : Fotografi"], answer: 0, explanation: "Teleskop digunakan mengamati Bintang dalam ilmu Astronomi. Sebanding dengan Mikroskop digunakan mengamati Bakteri dalam ilmu Biologi." },
      { q: "Perahu : Dayung : Sungai = ... : ... : ...", options: ["Mobil : Setir : Jalan", "Sepeda : Pedal : Jalan", "Pesawat : Kemudi : Udara", "Kapal : Baling-baling : Laut", "Kereta : Mesin : Rel"], answer: 1, explanation: "Perahu digerakkan oleh Dayung untuk melintasi Sungai. Sebanding dengan Sepeda digerakkan oleh Pedal untuk melintasi Jalan." },
      { q: "Pohon : Ranting : Daun = ... : ... : ...", options: ["Tubuh : Tangan : Jari", "Buku : Bab : Subbab", "Rumah : Kamar : Kasur", "Gedung : Lantai : Ruangan", "Kota : Jalan : Rumah"], answer: 0, explanation: "Pohon cabang utamanya Ranting dan di ujungnya terdapat Daun. Sebanding dengan Tubuh percabangannya Tangan dan di ujungnya terdapat Jari." }
    ];

    const form = document.getElementById("quizForm");
    const chunkSize = 10;
    
    questions.forEach((q, i) => {
      if (i % chunkSize === 0) {
        const sectionHeader = document.createElement("div");
        sectionHeader.className = "section-title";
        sectionHeader.innerText = `Bagian ${Math.floor(i / chunkSize) + 1} (Soal ${i + 1} - ${Math.min(i + chunkSize, questions.length)})`;
        form.appendChild(sectionHeader);
      }

      const block = document.createElement("div");
      block.className = "question-block";
      
      let optionsHTML = '';
      q.options.forEach((opt, j) => {
        optionsHTML += `
          <div class="options">
            <label>
              <input type="radio" name="q${i}" value="${j}">
              ${String.fromCharCode(65 + j)}. ${opt}
            </label>
          </div>`;
      });

      block.innerHTML = `
        <div class="question">${i + 1}. ${q.q}</div>
        ${optionsHTML}
      `;
      form.appendChild(block);
    });

    function submitQuiz() {
      let score = 0;
      let explanationsHTML = '<h2>Pembahasan Detail Soal:</h2>';

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name='q${i}']:checked`);
        const ansIndex = q.answer;
        const correctText = q.options[ansIndex];
        let userSelectedText = "Tidak dijawab";
        let isCorrect = false;

        if (selected) {
          const userVal = parseInt(selected.value);
          if (userVal === ansIndex) {
            score++;
            isCorrect = true;
          }
          userSelectedText = `${String.fromCharCode(65 + userVal)}. ${q.options[userVal]}`;
        }

        explanationsHTML += `
          <div class="explanation-item">
            <p><strong>Soal ${i + 1}:</strong> ${q.q}</p>
            <p>Jawaban Anda: <span style="color: ${isCorrect ? 'green' : 'red'}; font-weight: bold;">${userSelectedText}</span></p>
            <p>Jawaban Benar: <span class="correct-ans">${String.fromCharCode(65 + ansIndex)}. ${correctText}</span></p>
            <p><em>Analogi & Pembahasan:</em> ${q.explanation}</p>
          </div>
        `;
      });

      const finalScore = (score / questions.length) * 100;

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `
        <h2>Hasil Tes Anda</h2>
        <p style="font-size: 24px; font-weight: bold; margin: 10px 0;">Skor: ${score} / ${questions.length} (Nilai: ${finalScore.toFixed(1)})</p>
        <p>${finalScore >= 70 ? 'Luar biasa! Pemahaman analogi Anda sangat baik.' : 'Tetap semangat! Pelajari pembahasan di bawah untuk meningkatkan kemampuan analogi Anda.'}</p>
      `;
      resultDiv.classList.remove("hidden");

      const expDiv = document.getElementById("explanation");
      expDiv.innerHTML = explanationsHTML;
      expDiv.classList.remove("hidden");

      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
